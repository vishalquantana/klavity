  <rect x="352" y="140" width="144" height="34" rx="8" fill="#6366f1" opacity="0.18"/>
  <polyline points="366,157 374,165 390,147" fill="none" stroke="#4ade80" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
