  <line x1="76" y1="168" x2="212" y2="168" stroke="#6366f1" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  <line x1="92" y1="190" x2="226" y2="190" stroke="#f5f0e8" stroke-width="5" stroke-linecap="round" opacity="0.22"/>
  <line x1="92" y1="212" x2="188" y2="212" stroke="#f5f0e8" stroke-width="5" stroke-linecap="round" opacity="0.22"/>
  <line x1="76" y1="234" x2="204" y2="234" stroke="#6366f1" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
