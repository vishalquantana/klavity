  <line x1="600" y1="156" x2="756" y2="156" stroke="#4ade80" stroke-width="1.5" opacity="0.5"/>
  <circle cx="616" cy="141" r="4" fill="#4ade80" opacity="0.8"/>
  <circle cx="630" cy="141" r="4" fill="#f5f0e8" opacity="0.25"/>
  <circle cx="644" cy="141" r="4" fill="#f5f0e8" opacity="0.25"/>
