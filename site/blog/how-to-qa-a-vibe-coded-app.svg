  <line x1="381" y1="242" x2="367" y2="256" stroke="#f87171" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="404" y1="249" x2="474" y2="249" stroke="#f5f0e8" stroke-width="4" opacity="0.28" stroke-linecap="round"/>

  <!-- flow arrow out to shipped browser -->
  <path d="M530 210 L590 210" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
  <polyline points="578,201 590,210 578,219" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- verified browser window (right) -->
