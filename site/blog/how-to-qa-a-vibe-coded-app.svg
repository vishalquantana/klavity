  <rect x="352" y="186" width="144" height="34" rx="8" fill="#6366f1" opacity="0.18"/>
  <polyline points="366,203 374,211 390,193" fill="none" stroke="#4ade80" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="404" y1="203" x2="466" y2="203" stroke="#f5f0e8" stroke-width="4" opacity="0.28" stroke-linecap="round"/>

  <rect x="352" y="232" width="144" height="34" rx="8" fill="#f87171" opacity="0.16"/>
