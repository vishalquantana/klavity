<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-label="Vibe coding security risks: exposed key in the browser bundle, an open database, and a request with a swapped record ID">
  <rect width="800" height="420" fill="#1e1b2e"/>
  <circle cx="690" cy="60" r="150" fill="#6366f1" opacity="0.07"/>
  <circle cx="90" cy="380" r="120" fill="#6366f1" opacity="0.05"/>

  <!-- browser window: the frontend bundle -->
  <rect x="48" y="58" width="300" height="180" rx="12" fill="#f5f0e8" opacity="0.05" stroke="#6366f1" stroke-width="1.5"/>
  <line x1="48" y1="90" x2="348" y2="90" stroke="#6366f1" stroke-width="1.2" opacity="0.5"/>
  <circle cx="68" cy="74" r="4" fill="#f87171" opacity="0.8"/>
  <circle cx="82" cy="74" r="4" fill="#f5f0e8" opacity="0.3"/>
  <circle cx="96" cy="74" r="4" fill="#f5f0e8" opacity="0.3"/>
  <rect x="72" y="110" width="150" height="7" rx="3.5" fill="#f5f0e8" opacity="0.22"/>
  <rect x="72" y="130" width="196" height="7" rx="3.5" fill="#f5f0e8" opacity="0.16"/>
  <rect x="72" y="150" width="210" height="9" rx="4.5" fill="#f87171" opacity="0.85"/>
  <rect x="72" y="172" width="120" height="7" rx="3.5" fill="#f5f0e8" opacity="0.16"/>
  <rect x="72" y="192" width="168" height="7" rx="3.5" fill="#f5f0e8" opacity="0.22"/>
  <path d="M292 148 l20 0 M300 141 l0 14" stroke="#f87171" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="300" cy="155" r="16" fill="none" stroke="#f87171" stroke-width="2" opacity="0.6"/>

  <!-- flow arrow to the database -->
  <polyline points="360,148 440,148" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M434 141 l10 7 -10 7" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- database with an open padlock -->
  <ellipse cx="572" cy="92" rx="76" ry="22" fill="#6366f1" opacity="0.35" stroke="#6366f1" stroke-width="1.5"/>
  <path d="M496 92 L496 196 A76 22 0 0 0 648 196 L648 92" fill="#f5f0e8" opacity="0.05" stroke="#6366f1" stroke-width="1.5"/>
  <ellipse cx="572" cy="144" rx="76" ry="22" fill="none" stroke="#6366f1" stroke-width="1.2" opacity="0.45"/>
  <rect x="548" y="166" width="48" height="36" rx="6" fill="#f87171" opacity="0.9"/>
  <path d="M556 166 L556 152 A16 16 0 0 1 588 152" fill="none" stroke="#f87171" stroke-width="5" stroke-linecap="round"/>

  <!-- request rows: two broken, one checked -->
  <rect x="48" y="282" width="704" height="34" rx="8" fill="#f5f0e8" opacity="0.04" stroke="#f87171" stroke-width="1.2"/>
  <path d="M70 292 l16 14 M86 292 l-16 14" stroke="#f87171" stroke-width="2.6" stroke-linecap="round"/>
  <rect x="106" y="295" width="300" height="8" rx="4" fill="#f87171" opacity="0.5"/>

  <rect x="48" y="326" width="704" height="34" rx="8" fill="#f5f0e8" opacity="0.04" stroke="#f87171" stroke-width="1.2"/>
  <path d="M70 336 l16 14 M86 336 l-16 14" stroke="#f87171" stroke-width="2.6" stroke-linecap="round"/>
  <rect x="106" y="339" width="228" height="8" rx="4" fill="#f87171" opacity="0.5"/>

  <rect x="48" y="370" width="704" height="34" rx="8" fill="#4ade80" opacity="0.08" stroke="#4ade80" stroke-width="1.2"/>
  <path d="M68 387 l9 10 17 -20" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="106" y="383" width="366" height="8" rx="4" fill="#4ade80" opacity="0.55"/>
</svg>
