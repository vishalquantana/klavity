<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex,nofollow" />
<title>Superadmin P&amp;L · Klavity</title>
<script>(function(){try{var t=localStorage.getItem('klav-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/fonts/fonts.css" />
<link rel="stylesheet" href="/tokens.css" />
<script src="/icons.generated.js"></script>
<style>
:root{--ink:#f5f3ee;--ink-2:#ffffff;--ink-3:#efeae0;--paper:#19140f;--paper-dim:#574f45;--paper-faint:#706560;--indigo:#6366f1;--indigo-deep:#4f46e5;--amber:#d98324;--rose:#db2777;--green:#0f9d6b;--line:rgba(25,20,15,.12);
--display:'Fraunces',serif;--body:'Hanken Grotesk',system-ui,sans-serif;--mono:'JetBrains Mono',monospace}
[data-theme="dark"]{--ink:#0c0a08;--ink-2:#15110d;--ink-3:#1e1813;--paper:#f3ece1;--paper-dim:#b3a896;--paper-faint:#9b8f7e;--indigo:#8b8bf5;--indigo-deep:#6366f1;--amber:#e8a24a;--rose:#e8849a;--green:#9fd6a0;--line:rgba(243,236,225,.11)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--ink);color:var(--paper);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding:36px 22px 80px}
h1{font-family:var(--display);font-size:30px;font-weight:600;letter-spacing:-.01em;margin-bottom:4px}
.sub{color:var(--paper-faint);font-size:13px;margin-bottom:26px}
.sub .mono{font-family:var(--mono);font-size:11px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px}
.card{background:var(--ink-2);border:1px solid var(--line);border-radius:18px;padding:20px}
.card .k{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--paper-faint);display:flex;align-items:center;gap:6px;margin-bottom:10px}
.card .n{font-family:var(--display);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums}
.card .sub2{font-size:12px;color:var(--paper-faint);margin-top:6px}
.pos{color:var(--green)}.neg{color:var(--rose)}
.cac-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-top:14px}
.cac-grid .mini .mk{font-family:var(--mono);font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:var(--paper-faint)}
.cac-grid .mini .mn{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:3px}
.panel{background:var(--ink-2);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:22px}
.panel h2{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--paper-dim);margin-bottom:12px;display:flex;align-items:center;gap:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--paper-faint);font-weight:600;cursor:pointer;user-select:none}
th.r,td.r{text-align:right;font-variant-numeric:tabular-nums}
th.sorted{color:var(--indigo)}
tbody tr:hover{background:var(--ink-3)}
.wsname{font-weight:600}.wsown{color:var(--paper-faint);font-size:11px;font-family:var(--mono)}
.pill{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:20px;border:1px solid var(--line);color:var(--paper-dim)}
.pill.free{color:var(--amber)}
.free0{color:var(--paper-faint);font-style:italic}
.icon{vertical-align:-2px}
.err{color:var(--rose);font-size:14px;padding:20px}
.muted{color:var(--paper-faint)}
/* ── tab nav ── */
.tabs{display:flex;gap:8px;margin-bottom:22px}
.tab{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:8px 16px;border-radius:20px;border:1px solid var(--line);background:var(--ink-2);color:var(--paper-dim);cursor:pointer;transition:transform .15s ease,background .15s ease,color .15s ease,border-color .15s ease}
.tab:hover{transform:scale(1.02);border-color:var(--indigo);color:var(--paper)}
.tab:active{transform:scale(.97)}
.tab.active{background:var(--indigo);border-color:var(--indigo);color:#fff}
.view{display:none}.view.active{display:block}
/* ── buttons + forms ── */
.btn{font-family:var(--body);font-size:13px;font-weight:600;padding:9px 16px;border-radius:12px;border:1px solid var(--indigo);background:var(--indigo);color:#fff;cursor:pointer;transition:transform .15s ease,filter .15s ease}
.btn:hover{transform:scale(1.02);filter:brightness(1.08)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--paper-dim);border-color:var(--line)}
.btn.ghost:hover{color:var(--paper);border-color:var(--indigo)}
.btn.sm{font-size:11px;padding:5px 10px;border-radius:9px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:14px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--paper-faint)}
.fld input{background:var(--ink-3);border:1px solid var(--line);border-radius:10px;padding:9px 11px;color:var(--paper);font-family:var(--body);font-size:13px}
.fld input:focus{outline:none;border-color:var(--indigo)}
.preview{background:var(--ink-3);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px;font-family:var(--mono);font-size:12px;word-break:break-all}
.preview .pk{font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:var(--paper-faint);margin-bottom:4px}
.preview .pv{color:var(--indigo);margin-bottom:10px}
.preview .pv:last-child{margin-bottom:0}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.dot.on{background:var(--green)}.dot.off{background:var(--paper-faint)}
.formErr{color:var(--rose);font-size:12px;margin-bottom:10px;min-height:14px}
.drill{margin-top:10px;padding:14px;background:var(--ink-3);border:1px solid var(--line);border-radius:12px}
.drill h3{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--paper-dim);margin-bottom:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Superadmin</h1>
  <div class="sub" id="sub">Revenue, COGS &amp; campaign short-links. <span class="mono" id="gen"></span></div>

  <div class="tabs">
    <button type="button" class="tab active" id="tabPl" data-view="pl">P&amp;L</button>
    <button type="button" class="tab" id="tabLinks" data-view="links">Links</button>
  </div>

  <div class="view active" id="view-pl">
    <div class="cards" id="summary"></div>

    <div class="panel">
      <h2 id="cacHead">Customer Acquisition Cost</h2>
      <div class="cac-grid" id="cac"></div>
    </div>

    <div class="panel">
      <h2 id="wsHead">Workspaces</h2>
      <div style="overflow-x:auto">
        <table id="tbl">
          <thead><tr id="thead"></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="view" id="view-links">
    <div class="panel">
      <h2 id="createHead">Create short-link</h2>
      <div class="formErr" id="lkFormErr"></div>
      <div class="form-grid">
        <div class="fld" style="grid-column:1/-1"><label for="lkDest">Destination URL (https)</label><input id="lkDest" type="url" placeholder="https://klavity.in/pricing" /></div>
        <div class="fld"><label for="lkSource">utm_source</label><input id="lkSource" placeholder="reddit" /></div>
        <div class="fld"><label for="lkMedium">utm_medium</label><input id="lkMedium" placeholder="post" /></div>
        <div class="fld"><label for="lkCampaign">utm_campaign</label><input id="lkCampaign" placeholder="q3-launch" /></div>
        <div class="fld"><label for="lkTerm">utm_term</label><input id="lkTerm" placeholder="(optional)" /></div>
        <div class="fld"><label for="lkContent">utm_content</label><input id="lkContent" placeholder="(optional)" /></div>
        <div class="fld"><label for="lkSlug">Vanity slug (optional)</label><input id="lkSlug" placeholder="a-z0-9- 3–40" /></div>
        <div class="fld"><label for="lkLabel">Label</label><input id="lkLabel" placeholder="internal note" /></div>
      </div>
      <div class="preview">
        <div class="pk">Short URL</div><div class="pv" id="lkPrevShort">—</div>
        <div class="pk">Tagged destination</div><div class="pv" id="lkPrevDest">—</div>
      </div>
      <button type="button" class="btn" id="lkCreate">Create link</button>
    </div>

    <div class="panel">
      <h2 id="linksHead">Short-links</h2>
      <div style="overflow-x:auto">
        <table id="lkTbl">
          <thead><tr>
            <th>Code</th><th>Label</th><th>Campaign</th><th>Destination</th><th class="r">Clicks</th><th>Active</th><th></th>
          </tr></thead>
          <tbody id="lkBody"></tbody>
        </table>
      </div>
      <div id="lkDrill"></div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  function ic(name, size){ return (window.kicon ? window.kicon(name, { size: size || 13 }) : ""); }
  function money(n){
    var v = Number(n) || 0;
    var neg = v < 0;
    var s = "$" + Math.abs(v).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return neg ? "-" + s : s;
  }
  function num(n){ return (Number(n) || 0).toLocaleString(); }
  function pct(n){ return (Number(n) || 0).toFixed(1) + "%"; }
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return { "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c]; }); }

  var state = { rows: [], sortKey: "margin", sortDir: -1 };

  var COLS = [
    { key: "name", label: "Workspace / owner", num: false },
    { key: "planLabel", label: "Plan", num: false },
    { key: "mrr", label: "MRR", num: true },
    { key: "llmCost", label: "LLM $", num: true },
    { key: "storageCost", label: "Storage $", num: true },
    { key: "browserCost", label: "Browser $", num: true },
    { key: "emailCost", label: "Email $", num: true },
    { key: "totalCogs", label: "Total COGS", num: true },
    { key: "margin", label: "Margin", num: true },
    { key: "usage", label: "Usage (Sims / Runs+Steps / Reports / Rec min / Seats)", num: false }
  ];

  function renderSummary(d){
    var s = d.summary;
    var mp = s.grossMargin >= 0 ? "pos" : "neg";
    var cac = d.cac.cac == null ? "n/a" : money(d.cac.cac);
    var cards = [
      { k: ic("radio-tower") + "Total MRR", n: money(s.mrr), sub: num(s.workspaces) + " workspaces" },
      { k: ic("zap") + "Total COGS", n: money(s.cogs), sub: "LLM + storage + browser + email" },
      { k: ic("sprout") + "Gross Margin", n: "<span class='" + mp + "'>" + money(s.grossMargin) + "</span>", sub: "<span class='" + mp + "'>" + pct(s.grossMarginPct) + "</span> of MRR" },
      { k: ic("user") + "CAC", n: cac, sub: num(d.cac.convertedSignups) + " signups from free tools" }
    ];
    document.getElementById("summary").innerHTML = cards.map(function(c){
      return "<div class='card'><div class='k'>" + c.k + "</div><div class='n'>" + c.n + "</div><div class='sub2'>" + c.sub + "</div></div>";
    }).join("");
  }

  function renderCac(d){
    var c = d.cac;
    var minis = [
      { k: "CAC (all-time)", n: c.cac == null ? "n/a" : money(c.cac) },
      { k: "CAC (30d spend)", n: c.cac30d == null ? "n/a" : money(c.cac30d) },
      { k: "Free-tool spend (all-time)", n: money(c.freeToolSpendAllTime) },
      { k: "Free-tool spend (30d)", n: money(c.freeToolSpend30d) },
      { k: "Leads captured", n: num(c.leadsCaptured) + " (" + num(c.leadsCaptured30d) + " in 30d)" },
      { k: "Converted signups", n: num(c.convertedSignups) },
      { k: "Lead to signup", n: pct(c.leadToSignupPct) }
    ];
    document.getElementById("cac").innerHTML = minis.map(function(m){
      return "<div class='mini'><div class='mk'>" + esc(m.k) + "</div><div class='mn'>" + m.n + "</div></div>";
    }).join("");
  }

  function renderHead(){
    document.getElementById("thead").innerHTML = COLS.map(function(col){
      var cls = (col.num ? "r" : "") + (col.key === state.sortKey ? " sorted" : "");
      var arrow = col.key === state.sortKey ? (state.sortDir < 0 ? " ▼" : " ▲") : "";
      return "<th class='" + cls + "' data-key='" + col.key + "'>" + esc(col.label) + arrow + "</th>";
    }).join("");
    var ths = document.getElementById("thead").querySelectorAll("th");
    ths.forEach(function(th){
      th.addEventListener("click", function(){
        var k = th.getAttribute("data-key");
        if (k === "usage") return;
        if (state.sortKey === k) state.sortDir = -state.sortDir;
        else { state.sortKey = k; state.sortDir = (k === "name" || k === "planLabel") ? 1 : -1; }
        renderRows();
        renderHead();
      });
    });
  }

  function renderRows(){
    var rows = state.rows.slice();
    var k = state.sortKey, dir = state.sortDir;
    rows.sort(function(a, b){
      var av = a[k], bv = b[k];
      if (typeof av === "string") return dir * String(av).localeCompare(String(bv));
      return dir * ((Number(av) || 0) - (Number(bv) || 0));
    });
    document.getElementById("tbody").innerHTML = rows.map(function(w){
      var mcls = w.margin >= 0 ? "pos" : "neg";
      var mrrCell = w.snapOnlyOrFree
        ? "<span class='free0'>$0 · Snap/free</span>"
        : money(w.mrr);
      var u = w.usage;
      var usageTxt = num(u.sims) + " / " + num(u.autosimRuns) + "+" + num(u.autosimSteps) + " / " + num(u.reports) + " / " + num(u.recordingMinutes) + " / " + num(u.seats);
      return "<tr>"
        + "<td><div class='wsname'>" + esc(w.name) + "</div><div class='wsown'>" + esc(w.owner) + "</div></td>"
        + "<td><span class='pill" + (w.snapOnlyOrFree ? " free" : "") + "'>" + esc(w.planLabel) + "</span></td>"
        + "<td class='r'>" + mrrCell + "</td>"
        + "<td class='r'>" + money(w.llmCost) + "</td>"
        + "<td class='r'>" + money(w.storageCost) + "</td>"
        + "<td class='r'>" + money(w.browserCost) + "</td>"
        + "<td class='r'>" + money(w.emailCost) + "</td>"
        + "<td class='r'>" + money(w.totalCogs) + "</td>"
        + "<td class='r " + mcls + "'>" + money(w.margin) + "</td>"
        + "<td class='muted'>" + usageTxt + "</td>"
        + "</tr>";
    }).join("");
  }

  function boot(d){
    state.rows = d.workspaces || [];
    document.getElementById("cacHead").innerHTML = ic("user") + " Customer Acquisition Cost";
    document.getElementById("wsHead").innerHTML = ic("users") + " Workspaces · sorted by margin";
    var r = d.rates || {};
    document.getElementById("gen").textContent = "generated " + new Date(d.generatedAt).toLocaleString()
      + " · rates: storage $" + r.s3GbMonthUsd + "/GB-mo, egress $" + r.s3EgressGbUsd + "/GB, browser $" + r.browserMinUsd + "/min, email $" + r.emailSendUsd + "/send";
    renderSummary(d);
    renderCac(d);
    renderHead();
    renderRows();
  }

  fetch("/api/superadmin/pl", { credentials: "include" })
    .then(function(res){
      if (res.status === 403) throw new Error("Forbidden — this page is restricted to ops admins.");
      if (!res.ok) throw new Error("Failed to load P&L (" + res.status + ")");
      return res.json();
    })
    .then(boot)
    .catch(function(e){
      document.querySelector(".wrap").innerHTML = "<div class='err'>" + esc(e.message || String(e)) + "</div>";
    });
})();
</script>

<script>
(function(){
  "use strict";
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return { "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c]; }); }
  function el(id){ return document.getElementById(id); }
  function val(id){ var e = el(id); return e ? e.value.trim() : ""; }

  // Client mirror of server stampUtm — single-encode via URLSearchParams; unparseable/relative
  // destinations pass through unchanged (never throws in preview).
  function stampUtm(dest, utm){
    var url;
    try { url = new URL(dest); } catch (e) { return dest; }
    var map = [["source","utm_source"],["medium","utm_medium"],["campaign","utm_campaign"],["term","utm_term"],["content","utm_content"]];
    for (var i = 0; i < map.length; i++){
      var v = utm[map[i][0]];
      if (v == null) continue;
      var s = String(v);
      if (!s.length) continue;
      url.searchParams.set(map[i][1], s);
    }
    return url.toString();
  }

  function currentUtm(){
    return { source: val("lkSource"), medium: val("lkMedium"), campaign: val("lkCampaign"), term: val("lkTerm"), content: val("lkContent") };
  }

  function refreshPreview(){
    var dest = val("lkDest");
    var slug = val("lkSlug");
    var codeShown = slug || "<code>";
    el("lkPrevShort").textContent = location.origin + "/s/" + codeShown;
    el("lkPrevDest").textContent = dest ? stampUtm(dest, currentUtm()) : "—";
  }

  function copyText(t){
    try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t); } catch (e) {}
  }

  function renderRows(links){
    el("lkBody").innerHTML = (links || []).map(function(l){
      var shortUrl = location.origin + "/s/" + (l.slug || l.code);
      var dot = "<span class='dot " + (l.active ? "on" : "off") + "'></span>" + (l.active ? "on" : "off");
      var camp = (l.utm && l.utm.campaign) ? l.utm.campaign : "—";
      return "<tr data-id='" + esc(l.id) + "'>"
        + "<td class='mono'>" + esc(l.slug || l.code) + "</td>"
        + "<td>" + esc(l.label || "—") + "</td>"
        + "<td>" + esc(camp) + "</td>"
        + "<td class='muted' style='max-width:280px;overflow:hidden;text-overflow:ellipsis'>" + esc(l.destinationUrl) + "</td>"
        + "<td class='r'>" + (Number(l.clickCount) || 0) + "</td>"
        + "<td>" + dot + "</td>"
        + "<td style='white-space:nowrap'>"
          + "<button type='button' class='btn ghost sm act-copy' data-url='" + esc(shortUrl) + "'>Copy</button> "
          + "<button type='button' class='btn ghost sm act-toggle' data-id='" + esc(l.id) + "' data-active='" + (l.active ? "1" : "0") + "'>" + (l.active ? "Disable" : "Enable") + "</button> "
          + "<button type='button' class='btn ghost sm act-drill' data-id='" + esc(l.id) + "'>Stats</button>"
        + "</td>"
        + "</tr>";
    }).join("");

    var body = el("lkBody");
    body.querySelectorAll(".act-copy").forEach(function(b){ b.addEventListener("click", function(){ copyText(b.getAttribute("data-url")); b.textContent = "Copied"; setTimeout(function(){ b.textContent = "Copy"; }, 1200); }); });
    body.querySelectorAll(".act-toggle").forEach(function(b){ b.addEventListener("click", function(){ toggleLink(b.getAttribute("data-id"), b.getAttribute("data-active") !== "1"); }); });
    body.querySelectorAll(".act-drill").forEach(function(b){ b.addEventListener("click", function(){ drill(b.getAttribute("data-id")); }); });
  }

  function loadLinks(){
    fetch("/api/superadmin/links", { credentials: "include" })
      .then(function(r){ if (!r.ok) throw new Error("Failed to load links (" + r.status + ")"); return r.json(); })
      .then(function(d){ renderRows(d.links); })
      .catch(function(e){ el("lkBody").innerHTML = "<tr><td colspan='7' class='err'>" + esc(e.message || String(e)) + "</td></tr>"; });
  }

  function toggleLink(id, active){
    fetch("/api/superadmin/links/" + encodeURIComponent(id), {
      method: "PATCH", credentials: "include",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ active: active })
    }).then(function(r){ if (!r.ok) throw new Error("toggle failed"); }).then(loadLinks).catch(function(){ loadLinks(); });
  }

  function drill(id){
    fetch("/api/superadmin/links/" + encodeURIComponent(id), { credentials: "include" })
      .then(function(r){ if (!r.ok) throw new Error("Failed to load stats (" + r.status + ")"); return r.json(); })
      .then(function(d){
        var s = d.stats || { total:0, bots:0, humans:0, byDay:[], topReferers:[] };
        var days = (s.byDay || []).map(function(x){ return "<div>" + esc(x.day) + " · " + (Number(x.count)||0) + "</div>"; }).join("") || "<div class='muted'>no clicks yet</div>";
        var refs = (s.topReferers || []).map(function(x){ return "<div>" + esc(x.referer) + " · " + (Number(x.count)||0) + "</div>"; }).join("") || "<div class='muted'>no referers</div>";
        el("lkDrill").innerHTML = "<div class='drill'>"
          + "<h3>" + esc(d.link ? (d.link.slug || d.link.code) : id) + " · " + (Number(s.total)||0) + " clicks (" + (Number(s.humans)||0) + " human / " + (Number(s.bots)||0) + " bot)</h3>"
          + "<div class='form-grid'>"
            + "<div><div class='pk'>Clicks over time</div>" + days + "</div>"
            + "<div><div class='pk'>Top referers</div>" + refs + "</div>"
          + "</div></div>";
      })
      .catch(function(e){ el("lkDrill").innerHTML = "<div class='drill err'>" + esc(e.message || String(e)) + "</div>"; });
  }

  function create(){
    var dest = val("lkDest");
    el("lkFormErr").textContent = "";
    if (!dest){ el("lkFormErr").textContent = "Destination URL is required."; return; }
    var payload = { destinationUrl: dest, utm: currentUtm() };
    var slug = val("lkSlug"); if (slug) payload.slug = slug;
    var label = val("lkLabel"); if (label) payload.label = label;
    fetch("/api/superadmin/links", {
      method: "POST", credentials: "include",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(payload)
    }).then(function(r){
      return r.json().then(function(b){ return { ok: r.ok, status: r.status, body: b }; });
    }).then(function(res){
      if (!res.ok){ el("lkFormErr").textContent = (res.body && res.body.error) ? res.body.error : ("Create failed (" + res.status + ")"); return; }
      ["lkDest","lkSource","lkMedium","lkCampaign","lkTerm","lkContent","lkSlug","lkLabel"].forEach(function(id){ var e = el(id); if (e) e.value = ""; });
      refreshPreview();
      loadLinks();
    }).catch(function(e){ el("lkFormErr").textContent = e.message || String(e); });
  }

  // ── wiring ──
  var loaded = false;
  function showView(v){
    var isLinks = v === "links";
    el("view-pl").classList.toggle("active", !isLinks);
    el("view-links").classList.toggle("active", isLinks);
    el("tabPl").classList.toggle("active", !isLinks);
    el("tabLinks").classList.toggle("active", isLinks);
    if (isLinks && !loaded){ loaded = true; loadLinks(); }
  }
  el("tabPl").addEventListener("click", function(){ showView("pl"); });
  el("tabLinks").addEventListener("click", function(){ showView("links"); });
  ["lkDest","lkSource","lkMedium","lkCampaign","lkTerm","lkContent","lkSlug"].forEach(function(id){
    var e = el(id); if (e) e.addEventListener("input", refreshPreview);
  });
  el("lkCreate").addEventListener("click", create);
  refreshPreview();
})();
</script>
</body>
</html>
