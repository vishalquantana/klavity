<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Klavity Recorder</title>
  <style>
    body { margin: 0; background: #f5f3ee; color: #19140f; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #app { padding: 18px; }
    h1 { display: flex; align-items: center; gap: 8px; font-size: 17px; margin: 0 0 4px; }
    .for { margin: 0 0 12px; color: #574f45; font-size: 12px; }
    label { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
    .opt { font-size: 9px; font-weight: 800; color: #fff; background: #6366f1; padding: 1px 5px; border-radius: 999px; }
    .row { display: flex; gap: 8px; margin-top: 12px; }
    .col { display: flex; flex-direction: column; gap: 9px; margin-top: 8px; }
    button { font: inherit; padding: 8px 13px; border-radius: 8px; border: 1px solid #e3ddd1; background: #fffdf8; font-weight: 600; cursor: pointer; color: #19140f; }
    button.primary { border-color: #dc2626; background: #dc2626; color: #fff; }
    button.stop { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 16px; border-radius: 10px; border-color: #dc2626; background: #dc2626; color: #fff; font-weight: 700; font-size: 15px; }
    button.stop i { width: 12px; height: 12px; border-radius: 2px; background: #fff; }
    .dot { width: 11px; height: 11px; border-radius: 50%; background: #e11; flex: none; }
    .dot.off { background: #a8a29e; }
    .tip { font-size: 11px; color: #574f45; margin-top: 12px; padding: 8px; background: #efeadf; border-radius: 8px; border: 1px solid #e3ddd1; }
    .small { font-size: 12px; color: #574f45; }
    a { color: #4f46e5; }
  </style>
</head>
<body>
  <div id="app"><p class="small">Loading recorder…</p></div>
  <script src="/recorder-window.js"></script>
</body>
</html>
